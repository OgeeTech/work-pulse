<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <div class="status-indicator"></div>
        <h3>WorkPulse</h3>
      </div>
      <span id="date-label">Today</span>
    </div>

    <div class="total-banner">
      <div class="subtext">TOTAL MONITORED TIME</div>
      <div class="main-time" id="total-time">0h 0m</div>
    </div>

    <div class="activity-section">
      <h4>Domain Activity</h4>
      <div id="domain-list" class="domain-list">
        <div class="loading">Loading metrics...</div>
      </div>
    </div>

    <button id="export-json" class="btn">Export Metrics (JSON)</button>
    <script src="popup.js"></script>
  </body>
</html>
